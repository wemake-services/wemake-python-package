[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=2" ]


[tool.poetry]
name = "wemake-python-package"
version = "0.1.0"
description = "Bleeding edge cookiecutter template to create new python packages"
package-mode = false
license = "MIT"
authors = [
  "Nikita Sobolev <mail@sobolevn.me>",
]
readme = "README.md"
classifiers = [
  "Private :: Do not Upload",
]

[tool.poetry.dependencies]
python = "^3.11"
cookiecutter = "^2.7"
jinja2-git = "^1.4"
lice2 = "^0.13"

[tool.poetry.group.dev.dependencies]
binaryornot = "^0.6"
mypy = "^2.3"
pytest = "^9.1"
pytest-cookies = "^0.7"
pytest-randomly = "^4.1"
ruff = "^0.16"
wemake-python-styleguide = "^1.7"


[tool.ruff]
target-version = "py311"
line-length = 80
extend-exclude = [
  # Internal project:
  "[{][{]cookiecutter.project_name[}][}]",
]
# Ruff config: https://docs.astral.sh/ruff/settings
preview = true
fix = true
output-prefer-rule-codes = true

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "A",    # flake8-builtins
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "C90",  # maccabe
  "COM",  # flake8-commas
  "D",    # pydocstyle
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle
  "ERA",  # flake8-eradicate
  "EXE",  # flake8-executable
  "F",    # pyflakes
  "FBT",  # flake8-boolean-trap
  "FLY",  # pyflint
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "N",    # pep8-naming
  "PERF", # perflint
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff
  "S",    # flake8-bandit
  "SIM",  # flake8-simpify
  "SLF",  # flake8-self
  "SLOT", # flake8-slots
  "T100", # flake8-debugger
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle
  "YTT",  # flake8-2020
]
ignore = [
  "A005",    # allow to shadow stdlib and builtin module names
  "COM812",  # trailing comma, conflicts with `ruff format`
  # Different doc rules that we don't really care about:
  "D100",
  "D104",
  "D106",
  "D203",
  "D212",
  "D401",
  "D404",
  "D405",
  "ISC001",  # implicit string concat conflicts with `ruff format`
  "ISC003",  # prefer explicit string concat over implicit concat
  "PLR09",   # we have our own complexity rules
  "PLR2004", # do not report magic numbers
  "PLR6301", # do not require classmethod / staticmethod when self not used
  "RUF105",  # keep old `# noqa` comments style, not `# ruff` comments
  "RUF106",  # we prefer old error codes
  "RUF201",  # keep old rule codes instead of verbose names
  "TRY003",  # long exception messages from `tryceratops`
]
external = [ "WPS" ]
# Plugin configs:
flake8-quotes.inline-quotes = "single"
mccabe.max-complexity = 6
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
  "S101", # asserts
]


[tool.codespell]
# codespell configuration: https://github.com/codespell-project/codespell
skip = [
  "*.lock",
  ".mypy_cache",
  "__pycache__",
  "_build",
]


[tool.pyproject-fmt]
# Docs: https://pyproject-fmt.readthedocs.io/en/latest/configuration.html
column_width = 80
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"
separate_root_table = "\n\n"


[tool.typos.files]
# typos configuration: https://github.com/crate-ci/typos/
extend-exclude = [
  "__pycache__",
  "_build",
  ".mypy_cache",
  "*.lock",
]


[tool.mypy]
exclude = [
  "{{cookiecutter.project_name}}",
]
# The mypy configurations: http://bit.ly/2zEl9WI
ignore_missing_imports = true
warn_unreachable = true
enable_error_code = [
  "deprecated",
  "exhaustive-match",
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unimported-reveal",
  "unused-awaitable",
]
strict_equality_for_none = true
strict = true


[tool.pytest.ini_options]
# pytest config: http://doc.pytest.org/en/latest/customize.html
# Strict `@xfail` by default:
xfail_strict = true
# Fail on warnings:
filterwarnings = [ "error" ]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--doctest-modules",
  "--tb=short",
  # Custom template parts:
  "--ignore={{cookiecutter.project_name}}",
  "--ignore=hooks",
]
